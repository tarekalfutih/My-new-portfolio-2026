    <script>
      /* Arrived from Home (?from=home): back links go Home and the Work links are shown.
         Otherwise the back links already point to Work, so the Work nav links stay hidden. */
      (function () {
        if (new URLSearchParams(location.search).get('from') !== 'home') return;
        var home = document.querySelector('.cs-bar .hd-logo').getAttribute('href'); // Home (respects base path)
        document.querySelectorAll('[data-back]').forEach(function (back) {
          back.href = home;
          back.textContent = '← Home';
        });
        document.querySelectorAll('[data-work-link]').forEach(function (a) { a.hidden = false; });
      })();
    </script>
