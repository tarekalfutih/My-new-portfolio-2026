    <script>
      /* Arrived from Home (?from=home): back link goes Home and the Work link is shown.
         Otherwise the back link already points to Work, so the Work nav link stays hidden. */
      (function () {
        if (new URLSearchParams(location.search).get('from') !== 'home') return;
        var back = document.querySelector('[data-back]');
        back.href = '/';
        back.textContent = '← Home';
        document.querySelector('[data-work-link]').hidden = false;
      })();
    </script>
