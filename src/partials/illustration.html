<!-- Illustration section, shared by Home and Work (28 Oct handoff, code/preview.html).
     Styles: assets/css/illustration.css. Fireflies: assets/js/fireflies.js. -->
<section class="illo"{{attrs}} data-fireflies="20" data-ff-avoid=".illo-tri, .illo-title, .illo-p, .illo-latest, .illo-btn, .illo-cover">
    <div class="illo-shade" aria-hidden="true"></div>
    <div class="illo-grid">
      <div class="illo-cover">
        <a href="/illustration/?from={{from}}" aria-label="Skräphjältarna — read more"><img src="/assets/img/skraphjaltarna-cover.jpg" alt="" loading="lazy" decoding="async"></a>
      </div>
      <div class="illo-text">
        <div class="illo-tri" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <h3 class="illo-title"><a href="/illustration/?from={{from}}"><span class="illo-shine">Illustration &amp; Visual Storytelling</span></a></h3>
        <p class="illo-p">Alongside interaction design, I've illustrated 20+ children's books.</p>
        <p class="illo-latest">Personal Favourite: <strong>Skräphjältarna</strong>, 2023<br><strong class="illo-mint">6,000+ copies sold.</strong></p>
        <div class="illo-btns">
          <a class="illo-btn illo-btn--primary" href="/illustration/?from={{from}}"><span>Read about Skräphjältarna</span><span aria-hidden="true">→</span></a>
          <a class="illo-btn illo-btn--secondary" href="https://tarekalfutih.se" target="_blank" rel="noopener"><span>View Illustration Portfolio</span><span aria-hidden="true">↗︎</span></a>
        </div>
      </div>
    </div>
  </section>
