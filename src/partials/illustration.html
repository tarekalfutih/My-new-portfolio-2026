<!-- Illustration section, shared by Home and Work. Ported 1:1 from reference/illustration-section.html
     (IMPLEMENT-EXACTLY-ILLUSTRATION, 27 Oct). Styles: assets/css/illustration.css. Fireflies: assets/js/fireflies.js. -->
<section data-ref="ill-section" class="footnote"{{attrs}} data-fireflies="20" data-ff-avoid=".illo-text > div[aria-hidden], .illo-text h3, .illo-text p, .illo-latest span, .illo-btns a, .illo-cover" style="{{style}}position:relative;overflow:hidden;padding:120px 56px 140px;border-top:2px solid #1c1b1a;background:#0b1a5c url(/assets/img/forest-bg.jpg) center 70%/cover no-repeat;color:#fff">
    <div aria-hidden="true" class="illo-shade" style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,26,92,.15) 0%,rgba(11,26,92,.55) 55%,rgba(11,26,92,.8) 100%)"></div><div class="illo-grid" style="position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:center">
      <div data-ref="ill-cover" class="illo-cover" style="grid-column:2 / span 4;aspect-ratio:1/1;background:#ececea;box-shadow:0 24px 60px rgba(0,0,0,.45)">
        <a class="illo-link" href="/illustration/?from={{from}}" aria-label="Skräphjältarna — read more" style="display:block;width:100%;height:100%;cursor:pointer"><img src="/assets/img/skraphjaltarna-cover.jpg" alt="Skräphjältarna" loading="lazy" decoding="async" style="display:block;width:100%;height:100%;object-fit:cover"></a>
      </div>
      <div data-ref="ill-text" class="illo-text" style="grid-column:7 / span 5;display:flex;flex-direction:column">
        <div data-ref="ill-triangles" aria-hidden="true" style="display:flex;gap:6px;margin:0 0 20px"><span style="width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #f26b3a"></span><span style="width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #4cb867"></span><span style="width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #ffd23f"></span><span style="width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #a9b6ee"></span></div><h3 data-ref="ill-title" style="color:#fff;font:600 34px/1.1 Archivo;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance"><a class="illo-link" href="/illustration/?from={{from}}" style="color:inherit;text-decoration:none"><span class="illo-shine" style="background:linear-gradient(90deg,#ffe9a8,#7ee0b5,#ff6fb5,#a9b6ee,#ffe9a8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:illoShine 8s linear infinite">Illustration<span class="m-hide"> &amp; Visual Storytelling</span></span></a></h3>
        <p data-ref="ill-intro" style="font:400 17px/1.6 Archivo;color:#e5e9fb;margin:0 0 4px;max-width:460px;text-wrap:pretty"><span class="m-hide">Alongside interaction design, I've illustrated 20+ children's books.</span><span class="m-inl" style="display:none">20+ children's books.</span></p>
        <div data-ref="ill-latest" class="illo-latest" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;max-width:460px;margin:0 0 32px">
          <span style="font:400 17px/1.5 Archivo;color:#e5e9fb;text-wrap:pretty">Personal Favourite: <strong data-ref="ill-book-name" style="font-weight:700;color:#fff">Skräphjältarna</strong>, 2023<br><strong data-ref="ill-copies" style="font-weight:700;color:#7ee0b5">6,000+ copies sold.</strong></span>
        </div>
        <div data-ref="ill-buttons" class="illo-btns" style="display:flex;gap:12px;flex-wrap:wrap">
          <a class="hv5" data-ref="ill-btn-read" href="/illustration/?from={{from}}" style="display:inline-flex;align-items:center;gap:10px;min-height:44px;box-sizing:border-box;padding:0 20px;border:2px solid #b9a6f0;background:#b9a6f0;color:#0b1a5c;font:600 14px/1 Archivo;letter-spacing:.06em;text-transform:uppercase;text-decoration:none"><span class="m-hide">Read about Skräphjältarna</span><span class="m-inl" style="display:none">Skräphjältarna</span> <span aria-hidden="true">→</span></a>
          <a class="hv6" data-ref="ill-btn-portfolio" href="https://tarekalfutih.se" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:10px;min-height:44px;box-sizing:border-box;padding:0 20px;border:2px solid #7ee0b5;color:#7ee0b5;font:600 14px/1 Archivo;letter-spacing:.06em;text-transform:uppercase;text-decoration:none"><span>View Illustration Portfolio</span> <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </div>
  </section>
