<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#1b2a12">
		<title>Gilded Cage — play in the browser</title>
		<style>
/* Same look as the game: its pixel font (PixelOperator8, CC0) and the menu buttons' navy outline. */
@font-face {
	font-family: 'PixelOperator8';
	src: url('PixelOperator8-Bold.ttf') format('truetype');
	font-display: block;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #040112;
	background: #000;
	overflow: hidden;
	touch-action: none;
	font-family: 'PixelOperator8', monospace;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: the menu artwork, the game's font, a progress bar outlined like the menu buttons. */
#status {
	position: fixed;
	inset: 0;
	z-index: 2;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	background: #1b2a12 url('loading-bg.webp') center / cover no-repeat;
	image-rendering: pixelated;
}

.panel {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
	padding: 16px 22px;
	background: rgba(240, 255, 247, .78);
	border: 2px solid #040112;
	border-radius: 5px;
	font-size: 16px;
	line-height: 1.4;
	text-align: center;
}

#status-bar {
	width: min(280px, 64vw);
	height: 12px;
	border: 2px solid #040112;
	border-radius: 5px;
	overflow: hidden;
	box-sizing: border-box;
}

#status-fill {
	height: 100%;
	width: 0;
	background: #040112;
	transition: width .2s;
}

#status-bar.waiting #status-fill {
	width: 30%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }

#status-notice {
	display: none;
	max-width: 360px;
	font-size: 12px;
}

#status-notice a {
	color: #040112;
}

/* Phones and tablets: the browser version is for laptops and desktops (keyboard). */
#device {
	position: fixed;
	inset: 0;
	z-index: 5;
	display: none;
	align-items: center;
	justify-content: center;
	padding: 24px;
	background: #1b2a12 url('loading-bg.webp') center / cover no-repeat;
}

#device a {
	color: #040112;
}

@media (prefers-reduced-motion: reduce) {
	#status-bar.waiting #status-fill { animation: none; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" tabindex="0" aria-label="Gilded Cage game">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			<p style="padding:24px;color:#fff">Gilded Cage needs JavaScript to run in the browser.</p>
		</noscript>

		<div id="status" role="status" aria-live="polite">
			<div class="panel">
				<div id="status-text">Loading Gilded Cage…</div>
				<div id="status-bar" class="waiting"><div id="status-fill"></div></div>
				<div id="status-notice"></div>
			</div>
		</div>

		<div id="device">
			<div class="panel">
				<div>Play Gilded Cage on a laptop or desktop.</div>
				<a href="../../work/gilded-cage/" style="font-size:12px">Back to the case study</a>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12425188,"index.wasm":38057390},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const statusText = document.getElementById('status-text');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const notice = document.getElementById('status-notice');
	const canvas = document.getElementById('canvas');
	const back = '../../work/gilded-cage/';

	function fail(err) {
		console.error(err);
		statusText.textContent = 'The game could not start.';
		bar.style.display = 'none';
		notice.textContent = ((err && err.message) || String(err || 'Unknown error')) + ' ';
		const a = document.createElement('a');
		a.href = back;
		a.textContent = 'Back to the case study';
		notice.appendChild(a);
		notice.style.display = 'block';
	}

	// Laptops and desktops only: phones and tablets (no mouse or trackpad, or an iPad) get a message
	// instead, and the game is not downloaded.
	const ipad = /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1;
	const noMouse = !window.matchMedia('(any-pointer: fine)').matches;
	if (ipad || noMouse || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
		status.remove();
		canvas.remove();
		document.getElementById('device').style.display = 'flex';
		return;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error('This browser is missing: ' + missing.join(', ') + '. Try a recent Chrome, Edge, Firefox or Safari.'));
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				bar.classList.remove('waiting');
				fill.style.width = Math.round((current / total) * 100) + '%';
			}
		},
	}).then(function () {
		status.remove();
		canvas.focus();
		// Godot renames the tab after the project ("Gilded_Cage"); keep the page title.
		const title = 'Gilded Cage — play in the browser';
		const keep = function () { if (document.title !== title) document.title = title; };
		keep();
		new MutationObserver(keep).observe(document.querySelector('title'), { childList: true });
	}, fail);
}());
		</script>
	</body>
</html>
